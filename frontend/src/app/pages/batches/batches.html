<div class="page">
  <div class="page-head">
    <div>
      <h1>Batches</h1>
      <p>Watch a batch drain through the pipeline: waiting → OCR → validated. Showing the {{ batches().length }} most recent.</p>
    </div>
    <button class="btn primary" (click)="store.submitOpen.set(true)">Submit a batch</button>
  </div>

  <div class="stack">
    @for (b of batches(); track b.id) { <app-batch-card [batch]="b" /> }
    @empty {
      <div class="card empty">
        No batches yet. Open <b>Submit jobs → Batch</b> and send 100 or more to see progress bars fill in realtime.
      </div>
    }
  </div>
</div>
