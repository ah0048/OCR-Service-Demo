<div class="page">
  <div class="page-head">
    <div>
      <h1>Jobs</h1>
      <p>The <span class="mono">jobs</span> table in PostgreSQL, live. Filter, search, and click any row for the full story.</p>
    </div>
    <div class="live-ctl">
      <span class="chip" [class]="paused() ? 'slate' : 'ok'">{{ paused() ? 'Paused' : 'Auto-refreshing' }}</span>
      <button class="btn sm" (click)="paused.set(!paused())">{{ paused() ? 'Resume' : 'Pause' }}</button>
    </div>
  </div>

  <div class="card">
    <div class="filters">
      <div class="field grow">
        <label>Search</label>
        <input class="input" placeholder="Client reference, image name, or full job id" [value]="search()" (input)="setSearch($any($event.target).value)" />
      </div>
      <div class="field">
        <label>State</label>
        <select class="input" (change)="setStatus($any($event.target).value)">
          <option value="">All</option>
          <option value="Queued">Queued</option>
          <option value="OcrInProgress">OCR processing</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div class="field">
        <label>Outcome</label>
        <select class="input" (change)="setOutcome($any($event.target).value)">
          <option value="">All</option>
          @for (o of outcomes; track o[0]) { <option [value]="o[0]">{{ o[1] }}</option> }
        </select>
      </div>
      <div class="field">
        <label>Page size</label>
        <select class="input" (change)="setPageSize(+$any($event.target).value)">
          @for (n of [10, 25, 50, 100]; track n) { <option [value]="n" [selected]="n === pageSize()">{{ n }}</option> }
        </select>
      </div>
    </div>

    @if (batchId()) {
      <div class="bf">
        Filtered to batch <span class="chip info">#{{ short(batchId()) }}</span>
        <button class="btn sm ghost" (click)="clearBatch()">Clear ✕</button>
      </div>
    }

    <div class="summary">
      <b class="num">{{ data()?.total ?? 0 }}</b> matching jobs
    </div>

    <app-jobs-table [rows]="data()?.items ?? []" />

    <div class="pager">
      <span class="muted num">Page {{ page() }} of {{ pages() }}</span>
      <div>
        <button class="btn sm" [disabled]="page() <= 1" (click)="go(1)">« First</button>
        <button class="btn sm" [disabled]="page() <= 1" (click)="go(page() - 1)">‹ Prev</button>
        <button class="btn sm" [disabled]="page() >= pages()" (click)="go(page() + 1)">Next ›</button>
        <button class="btn sm" [disabled]="page() >= pages()" (click)="go(pages())">Last »</button>
      </div>
    </div>
  </div>
</div>
