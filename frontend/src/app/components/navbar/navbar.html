<div class="banner" role="img" aria-label="Egyptian Exchange">
  <div class="banner-fade"></div>
</div>
<nav class="topbar">
  <div class="inner">
    <a class="brand" routerLink="/">
      <img src="EGX white.png" alt="The Egyptian Exchange" class="logo" />
      <span class="sep"></span>
      <span class="product"><b>ID OCR monitor</b></span>
    </a>

    <div class="links">
      <a routerLink="/overview" routerLinkActive="active">Overview</a>
      <a routerLink="/pipeline" routerLinkActive="active">Queues &amp; workers</a>
      <a routerLink="/results" routerLinkActive="active">Tech view</a>
      <a routerLink="/business" routerLinkActive="active">Business view</a>
      <a routerLink="/jobs" routerLinkActive="active">Jobs</a>
      <a routerLink="/batches" routerLinkActive="active">Batches</a>
    </div>

    <div class="right">
      <div class="textsize" role="group" aria-label="Text size">
        <button (click)="ui.smaller()" [disabled]="!ui.canShrink()" aria-label="Smaller text" title="Smaller text">A&minus;</button>
        <span class="num" title="Current text size">{{ ui.percent() }}%</span>
        <button class="plus" (click)="ui.bigger()" [disabled]="!ui.canGrow()" aria-label="Larger text" title="Larger text">A+</button>
      </div>
      <span class="live" [class.off]="!store.connected()">
        <i></i>{{ store.connected() ? 'Live' : 'Reconnecting' }}
      </span>
      <button class="submit" (click)="store.submitOpen.set(true)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
        Submit jobs
      </button>

      <div class="bell-wrap">
        <button class="icon-btn" (click)="open.set(!open()); $event.stopPropagation()" aria-label="Alerts">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
          </svg>
          @if (store.alerts().length) { <em class="badge">{{ store.alerts().length }}</em> }
        </button>
        @if (open()) {
          <div class="drop" (click)="$event.stopPropagation()">
            <h4>Alerts</h4>
            @for (a of store.alerts(); track a.text) {
              <div class="alert" [class]="a.level"><i></i><span>{{ a.text }}</span></div>
            } @empty {
              <div class="alert ok"><i></i><span>All systems nominal. No dead letters, workers online.</span></div>
            }
          </div>
        }
      </div>

      <div class="emblem" title="EGX OCR demo"><img src="bell.png" alt="EGX" /></div>
    </div>
  </div>
</nav>
