<div class="frame">
  @if (src(); as url) {
    <img [src]="url" [alt]="alt()" />
  } @else if (side() === 'front') {
    <svg viewBox="0 0 160 101" class="card-art" role="img" [attr.aria-label]="alt() + ' front (placeholder)'">
      <rect x="1" y="1" width="158" height="99" rx="9" fill="#f7f9fd" stroke="#cdd6e8" stroke-width="1.5" />
      <path d="M10 1h140a9 9 0 0 1 9 9v10H1V10a9 9 0 0 1 9-9z" [attr.fill]="accent()" opacity="0.9" />
      <rect x="12" y="7" width="46" height="6" rx="3" fill="#ffffff" opacity="0.85" />
      <!-- photo -->
      <rect x="14" y="31" width="38" height="48" rx="5" fill="#e3e9f5" />
      <circle cx="33" cy="48" r="8.5" fill="#b4c0da" />
      <path d="M17 79c1-11 8-17 16-17s15 6 16 17z" fill="#b4c0da" />
      <!-- text lines -->
      <rect x="64" y="33" width="52" height="6" rx="3" fill="#c7d1e6" />
      <rect x="64" y="46" width="78" height="5" rx="2.5" fill="#dbe2f0" />
      <rect x="64" y="57" width="66" height="5" rx="2.5" fill="#dbe2f0" />
      <rect x="64" y="68" width="40" height="5" rx="2.5" fill="#dbe2f0" />
      <rect x="64" y="82" width="86" height="8" rx="2" fill="#e8edf7" />
    </svg>
  } @else {
    <svg viewBox="0 0 160 101" class="card-art" role="img" [attr.aria-label]="alt() + ' back (placeholder)'">
      <rect x="1" y="1" width="158" height="99" rx="9" fill="#f7f9fd" stroke="#cdd6e8" stroke-width="1.5" />
      <!-- stripe along the top -->
      <rect x="1" y="12" width="158" height="13" fill="#c7d1e6" />
      <rect x="1" y="12" width="158" height="3" [attr.fill]="accent()" opacity="0.9" />
      <!-- address / details lines -->
      <rect x="12" y="34" width="70" height="5" rx="2.5" fill="#dbe2f0" />
      <rect x="12" y="45" width="86" height="5" rx="2.5" fill="#dbe2f0" />
      <rect x="12" y="56" width="58" height="5" rx="2.5" fill="#dbe2f0" />
      <!-- QR-style block -->
      <rect x="112" y="33" width="35" height="35" rx="3" fill="#e3e9f5" />
      <rect x="116" y="37" width="10" height="10" fill="#9fb0d2" />
      <rect x="133" y="37" width="10" height="10" fill="#9fb0d2" />
      <rect x="116" y="54" width="10" height="10" fill="#9fb0d2" />
      <rect x="130" y="51" width="5" height="5" fill="#b4c0da" />
      <rect x="137" y="58" width="6" height="6" fill="#b4c0da" />
      <!-- barcode -->
      <g fill="#aebbd6">
        <rect x="12" y="76" width="2" height="14" /><rect x="16" y="76" width="4" height="14" /><rect x="22" y="76" width="2" height="14" />
        <rect x="27" y="76" width="3" height="14" /><rect x="33" y="76" width="2" height="14" /><rect x="37" y="76" width="5" height="14" />
        <rect x="45" y="76" width="2" height="14" /><rect x="50" y="76" width="3" height="14" /><rect x="56" y="76" width="2" height="14" />
        <rect x="61" y="76" width="4" height="14" /><rect x="68" y="76" width="2" height="14" /><rect x="73" y="76" width="3" height="14" />
        <rect x="79" y="76" width="5" height="14" /><rect x="87" y="76" width="2" height="14" />
      </g>
      <!-- signature box -->
      <rect x="100" y="76" width="47" height="14" rx="2" fill="#eef2fa" stroke="#d3dbe9" stroke-width="1" />
    </svg>
  }
  @if (!src()) { <span class="tag">placeholder</span> }
</div>
<span class="side">{{ side() === 'front' ? 'Front' : 'Back' }}</span>
